name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain from lean-toolchain, fetches the mathlib
      # olean cache, caches .lake in the GitHub cache, and builds the
      # library targets.
      - name: Build libraries
        uses: leanprover/lean-action@v1
        with:
          build-args: EquiVM EVM ABI Storage Refinement EVMReasoning Solm Solidity
          use-github-cache: true

      # Mirrors the imports of Solm/Examples.lean. Remove lines to prune.
      - name: Build examples
        run: |
          lake build \
            Solm.Examples.Pow.Correct \
            Solm.Examples.Truth.Correct \
            Solm.Examples.Caller.Correct \
            Solm.Examples.ERC20.Correct \
            Solm.Examples.CtorTruth.Correct \
            Solm.Examples.CtorStore.Correct \
            Solm.Examples.TinyImmutable.Correct \
            Solm.Examples.Ballot.Correct \
            Solm.Examples.SimpleAuction.Correct \
            Solm.Examples.StringStoreLite.Correct \
            Solm.Examples.BlindAuction.Correct \
            Solm.Examples.OpenZeppelinBench.Ownable2Step.Correct \
            Solm.Examples.OpenZeppelinBench.AccessControl.Correct \
            Solm.Examples.OpenZeppelinBench.Pausable.Correct \
            Solm.Examples.OpenZeppelinBench.ERC6909.Correct \
            Solm.Examples.UniswapV2Pair.Correct \
            Solm.Examples.Reuse.Correct \
            Solm.Examples.VyperERC20.Correct

      # Solidity-language transcriptions used by the differential harness.
      - name: Build Solidity specs
        run: lake build Solidity.Test.Specs

      # ERC20 refinement proof against its Solidity spec (core relation) and the
      # interpreter/relation equivalence theorems.
      - name: Build Solidity proofs
        run: |
          lake build \
            Solidity.Theory.InterpEquiv \
            Solidity.Examples.ERC20.Correct

      # These End dispatch consumers previously overflowed Lean's default stack.
      # Keep this focused regression check even while the full benchmarks are disabled.
      - name: Check End dispatch proof stack
        run: |
          lake build \
            Solm.Benchmarks.Dss.End.Rely \
            Solm.Benchmarks.Dss.End.Out \
            Solm.Benchmarks.Dss.End.Bag \
            Solm.Benchmarks.Dss.End.Fix \
            Solm.Benchmarks.Dss.End.Art

      # Immutable PUSH32 decoding must not reduce the full Clipper bytecode template.
      - name: Check Clipper decoder proof stack
        run: |
          lake build \
            Solm.Benchmarks.Dss.Clipper.Upchost \
            Solm.Benchmarks.Dss.Clipper.YankEVM

      # Benchmarks are too large for regular GitHub-hosted CI right now, commenting out. TODO add separate workflow
      # Mirrors the imports of Solm/Benchmarks.lean. Remove lines to prune.
      # - name: Build benchmarks
      #   run: |
      #     lake build \
      #       Solm.Benchmarks.Auction.Correct \
      #       Solm.Benchmarks.WETH9.Correct \
      #       Solm.Benchmarks.Dss.Dai.Correct \
      #       Solm.Benchmarks.Dss.Jug.Correct \
      #       Solm.Benchmarks.Dss.Vat.Correct \
      #       Solm.Benchmarks.Dss.Pot.Correct \
      #       Solm.Benchmarks.Dss.Spot.Correct \
      #       Solm.Benchmarks.Dss.Vow.Correct \
      #       Solm.Benchmarks.Dss.LinearDecrease.Correct \
      #       Solm.Benchmarks.Dss.StairstepExponentialDecrease.Correct \
      #       Solm.Benchmarks.Dss.ExponentialDecrease.Correct \
      #       Solm.Benchmarks.Dss.Cat.Correct \
      #       Solm.Benchmarks.Dss.Clipper.Correct \
      #       Solm.Benchmarks.Dss.Cure.Correct \
      #       Solm.Benchmarks.Dss.Dog.Correct \
      #       Solm.Benchmarks.Dss.End.Correct \
      #       Solm.Benchmarks.Dss.Flapper.Correct \
      #       Solm.Benchmarks.Dss.Flipper.Correct \
      #       Solm.Benchmarks.Dss.Flopper.Correct \
      #       Solm.Benchmarks.Dss.GemJoin.Correct \
      #       Solm.Benchmarks.Dss.DaiJoin.Correct

      # # Scaffolded benchmarks: specs + bytecode compile, proofs are sorry stubs.
      # - name: Build benchmark scaffolds
      #   run: lake build Solm.Benchmarks.Scaffolds

  # Native keccak + EVM differential tests of the Solidity spec language (compiles the closure
  # to C; run on demand).
  solidity-diff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: solidity-diff
          use-github-cache: true
      - name: Run solidity-diff
        run: lake exe solidity-diff --all
