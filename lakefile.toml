name = "EquiVM"
version = "0.1.0"
# defaultTargets = ["evmlean"] this currently does no correspond to anything
defaultTargets = ["Stele"]

[[lean_lib]]
name = "EquiVM"

[[lean_lib]]
name = "EVM"

[[lean_lib]]
name = "ABI"

[[lean_lib]]
name = "Stele"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

[[lean_lib]]
name = "Reasoning"
globs = ["Reasoning.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

[[lean_lib]]
name = "Benchmarks"
globs = ["Benchmarks.*"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# Differential tests of Stele specifications against their compiled bytecode (`Tests/DiffTest/README.md`).
[[lean_exe]]
name = "stele-difftest"
root = "Tests.DiffTest.Main"

# [[lean_exe]]
# name = "equivm"
# root = "EquiVM"

[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "no-py-base"
