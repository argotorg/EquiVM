name = "EquiVM"
version = "0.1.0"
# defaultTargets = ["evmlean"] this currently does no correspond to anything
defaultTargets = ["Solm"]

[[lean_lib]]
name = "EquiVM"

[[lean_lib]]
name = "EVM"

[[lean_lib]]
name = "ABI"

[[lean_lib]]
name = "Storage"

[[lean_lib]]
name = "Refinement"

[[lean_lib]]
name = "EVMReasoning"
globs = ["EVMReasoning.*"]

# Roots only: `lake build Solm` builds the language, not its proofs (explicit targets).
[[lean_lib]]
name = "Solm"

[[lean_lib]]
name = "Solidity"

[[lean_exe]]
name = "solidity-diff"
root = "Solidity.Test.Main"

# [[lean_exe]]
# name = "equivm"
# root = "EquiVM"

[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "step_semantics"
