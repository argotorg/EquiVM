name = "EquiVM"
version = "0.1.0"
# defaultTargets = ["evmlean"] this currently does no correspond to anything
defaultTargets = ["Stele"]

[[lean_lib]]
name = "EquiVM"

[[lean_lib]]
name = "EVM"

[[lean_lib]]
name = "ABI"

[[lean_lib]]
name = "Stele"

# see `Benchmarks` below
[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]
weakLeanArgs = ["--tstack=32768"]

[[lean_lib]]
name = "Reasoning"
globs = ["Reasoning.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

# The kernel check of a bytecode file recurses once per byte and overflows the default 8 MB
# stack at about 6.5 KB of bytecode. 32 MB is enough for the 24 KB limit of EIP-170.
[[lean_lib]]
name = "Benchmarks"
globs = ["Benchmarks.*"]
weakLeanArgs = ["--tstack=32768"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# Differential tests of Stele specifications against their compiled bytecode (`Tests/DiffTest/README.md`).
[[lean_exe]]
name = "stele-difftest"
root = "Tests.DiffTest.Main"

# [[lean_exe]]
# name = "equivm"
# root = "EquiVM"

[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "main"
