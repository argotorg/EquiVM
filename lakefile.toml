name = "EquiVM"
version = "0.1.0"
# defaultTargets = ["evmlean"] this currently does no correspond to anything
defaultTargets = ["Stele"]

[[lean_lib]]
name = "EquiVM"

[[lean_lib]]
name = "EVM"

[[lean_lib]]
name = "ABI"

[[lean_lib]]
name = "Stele"

# `--tstack`: see `Benchmarks` below (the listing of `Examples/UniswapV2Pair` is 8.8 K bytes).
[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]
weakLeanArgs = ["--tstack=32768"]

[[lean_lib]]
name = "Reasoning"
globs = ["Reasoning.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]

# `--tstack`: a contract's listing (`Bytecode.lean`) checks its table against its bytecode in the kernel,
# one deep recursion over the byte list (about 1.2 KB of C++ stack per byte); the default 8 MB
# is not enough past roughly 6.5 K bytes. 32 MB covers the 24 KB EIP-170 limit.
[[lean_lib]]
name = "Benchmarks"
globs = ["Benchmarks.*"]
weakLeanArgs = ["--tstack=32768"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# Differential tests of Stele specifications against their compiled bytecode (`Tests/DiffTest/README.md`).
[[lean_exe]]
name = "stele-difftest"
root = "Tests.DiffTest.Main"

# [[lean_exe]]
# name = "equivm"
# root = "EquiVM"

[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "main"
